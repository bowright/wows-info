<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#334155" stroke-width="8" />

  <!-- Outer Ring Detail -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />

  <!-- Stylized Anchor & Warship Emblem -->
  <g id="anchor-emblem" filter="url(#glow)">
    <!-- Anchor Top Ring -->
    <circle cx="256" cy="130" r="34" fill="none" stroke="url(#gold-grad)" stroke-width="20" />
    <circle cx="256" cy="130" r="14" fill="#0f172a" />

    <!-- Anchor Crossbar -->
    <rect x="180" y="174" width="152" height="18" rx="6" fill="url(#gold-grad)" />
    <circle cx="180" cy="183" r="14" fill="url(#gold-grad)" />
    <circle cx="332" cy="183" r="14" fill="url(#gold-grad)" />

    <!-- Anchor Central Shank -->
    <rect x="244" y="150" width="24" height="210" rx="8" fill="url(#gold-grad)" />

    <!-- Anchor Lower Flukes Arc -->
    <path d="M 120 280 C 120 390, 392 390, 392 280" fill="none" stroke="url(#gold-grad)" stroke-width="24" stroke-linecap="round" />

    <!-- Left Fluke Tip -->
    <polygon points="120,280 100,240 148,260" fill="url(#gold-grad)" />
    <!-- Right Fluke Tip -->
    <polygon points="392,280 412,240 364,260" fill="url(#gold-grad)" />

    <!-- Center Bottom Point -->
    <circle cx="256" cy="380" r="16" fill="url(#gold-grad)" />
  </g>

  <!-- High-tech Grid Radar / Compass Rays -->
  <line x1="256" y1="50" x2="256" y2="80" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <line x1="256" y1="432" x2="256" y2="462" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <line x1="50" y1="256" x2="80" y2="256" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <line x1="432" y1="256" x2="462" y2="256" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8" />
</svg>
